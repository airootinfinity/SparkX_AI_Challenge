# TEAM FILE 4 of 4 - team.yaml                                        (you may edit this file)
#
# STARTER VERSION: the localisation, mapping and navigation settings below work as they are, so the
# rover can map and drive from the first launch. The three sections for your own nodes are nearly
# empty: add a parameter here and read it in your node with self.declare_parameter(name, default).
#
# Every tunable number of your stack lives here: your three nodes, and the localisation / mapping /
# navigation nodes the locked launch file starts for you. The locked launch always forces
# use_sim_time: true and the topic names; everything else below is yours to change.
#
# Sections (ROS node names):
#   sparkx_perception, sparkx_semantic_memory, sparkx_mission        your nodes (files 1-3)
#   ekf_filter_node                                                  wheel odometry + IMU -> odom
#   pointcloud_to_laserscan                                          3D LiDAR -> 2D scan for SLAM / Nav2
#   slam_toolbox                                                     map + map->odom
#   bt_navigator, controller_server, planner_server, behavior_server, local_costmap, global_costmap   Nav2

# ------------------------------------------------------------------------------------ your nodes
sparkx_perception:
  ros__parameters:
    rate_hz: 5.0                  # how often detect() runs. Add your own parameters here (model_dir is set by the launch file)

sparkx_semantic_memory:
  ros__parameters:
    publish_rate_hz: 1.0          # how often /team/semantic_map is published (at least 0.5). Add your own parameters here

sparkx_mission:
  ros__parameters:
    demo: true                    # the starter's demo: 3 m forward, back to base, end the mission. Set false once you have a strategy.

# ------------------------------------------------------------------------------------ localisation
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /wheel/odom
    # vx, vyaw from wheels (skid-steer: vy ~ 0)
    odom0_config: [false, false, false,  false, false, false,
                   true,  true,  false,  false, false, true,
                   false, false, false]
    odom0_differential: false
    imu0: /imu/data
    imu0_config: [false, false, false,  false, false, false,
                  false, false, false,  false, false, true,
                  false, false, false]
    imu0_remove_gravitational_acceleration: true

pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.1
    min_height: 0.15       # ignore ground / low debris the robot can cross
    max_height: 1.0
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0061
    scan_time: 0.1
    range_min: 0.35
    range_max: 40.0
    use_inf: true

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.1
    max_laser_range: 30.0
    minimum_time_interval: 0.3
    transform_publish_period: 0.05
    map_update_interval: 2.0
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
    loop_search_maximum_distance: 5.0
    link_match_minimum_response_fine: 0.1
    correlation_search_space_dimension: 0.5
    loop_match_minimum_chain_size: 10
    throttle_scans: 1
    stack_size_to_use: 40000000
    enable_interactive_mode: false

# ------------------------------------------------------------------------------------ navigation
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 6.28
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0           # the platform limit
      lookahead_dist: 0.9          # short look-ahead: follow the planned path through doorways instead of cutting corners
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.4
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 1.2
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.8   # 0.6 s stops too late from 1 m/s; 1 s ahead in a doorway is the opposite wall
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.0       # start slowing 1 m from an obstacle
      cost_scaling_gain: 0.8
      inflation_cost_scaling_factor: 2.5
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.2
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 2.5
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.1
      footprint: "[[0.52, 0.36], [0.52, -0.36], [-0.52, -0.36], [-0.52, 0.36]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan keepout
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          raytrace_max_range: 15.0
          # The LiDAR sits 0.78 m up and looks at most 22.5 deg down, so it cannot see low rubble
          # (or a person lying down) closer than ~1.5 m. Never erase what is that close.
          raytrace_min_range: 2.0
          obstacle_max_range: 12.0
        keepout:
          topic: /team/keepout
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 1000.0
          observation_persistence: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 2.5

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.1
      track_unknown_space: true
      footprint: "[[0.52, 0.36], [0.52, -0.36], [-0.52, -0.36], [-0.52, 0.36]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan keepout
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          raytrace_max_range: 20.0
          raytrace_min_range: 2.0
          # Walls come from the SLAM map (static layer). This layer adds what the robot sees within
          # 6 m: far enough to route around low rubble in good time (at 3 m the new path arrives
          # too late at 1 m/s), near enough that a pose 3 degrees off smears a wall by 0.3 m, not
          # the 0.8 m that closes a 1.5 m doorway for the planner.
          obstacle_max_range: 6.0
        keepout:
          topic: /team/keepout
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 1000.0
          observation_persistence: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 3.0          # wide, gentle cost slope: global paths run down the middle of the street
        cost_scaling_factor: 1.8

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.8
      use_astar: false      # Dijkstra: NavFn's A* fails with "legal potential was found" on large maps
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0
