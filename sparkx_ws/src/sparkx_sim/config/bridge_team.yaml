# SparkX ros_gz_bridge: TEAM-FACING topics (the only simulator data teams may use).
# Teams publish velocity on /cmd_vel; the referee gates it to /sparkx/robot/cmd_vel (not bridged here).
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /lidar/points
  gz_topic_name: /sparkx/robot/lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /camera/color/image_raw
  gz_topic_name: /sparkx/robot/rgbd/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /camera/color/camera_info
  gz_topic_name: /sparkx/robot/rgbd/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

- ros_topic_name: /camera/depth/image_raw
  gz_topic_name: /sparkx/robot/rgbd/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /camera/depth/points
  gz_topic_name: /sparkx/robot/rgbd/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /thermal/image_raw
  gz_topic_name: /sparkx/robot/thermal/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /thermal/camera_info
  gz_topic_name: /sparkx/robot/thermal/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

- ros_topic_name: /imu/data
  gz_topic_name: /sparkx/robot/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /wheel/odom
  gz_topic_name: /sparkx/robot/wheel_odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /sparkx/robot/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
